<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name='author' href="https://github.com/juliansfreelance" email="jcalderon.code@gmail.com" content='Julio Calderón' />
    <meta name="description" content="Jivi Superioridad Clinica" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..16,700&display=swap" rel="stylesheet">

    <title>Jivi Superioridad Clinica</title>
    <style>
        /* Reglas generales */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        @media (prefers-reduced-motion: no-preference) {
            :root {
                scroll-behavior: smooth;
            }
        }

        html {
            background-color: #FFFFFF;
        }

        body {
            font-family: "Nunito Sans", sans-serif;
            font-weight: 400;
            font-style: normal;
            line-height: 1.5;
            background: #FAFAFA;
            margin: 0 auto;
            padding: 0 0 0 0;
            width: 900px;
            position: relative;
        }
        img {
            width: 100%;
            height: auto;
        }

       
        /*.link_safe {
            position: absolute;
            color: transparent;
            text-decoration: none;
            background-color: rgb(255, 0, 0, 0.6); 
            font-size: 12px;
        }*/
        
        .nombre, 
        .saludo {
            position: absolute;
            /*background: #000;*/
            /* opacity: 0.5;*/
            font-size: 22px;
            color: #294294;
            text-align: left;
            font-weight: 700; 
        }
        /*.nombre {
            top: 256px;
            left: 62px;
            font-size: 20px;
        }*/

        .saludo {
    top: 3995px;
    left: 60px;
    color: #000000;
    font-size: 21px;
        }
        
        .link_safe {
            top: 2398px;
            left: 542px;
            width: 289px;
            height: 14px;
        }

        
        .footer {
            background-color: white;
            position: absolute;
            display: flex;
            bottom: 11px;
            padding: 8px 0px;
            width: 100%;
            height: auto;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
        }

        
        .footer a {
            color: #382e59;
            font-size: 12px;
            text-decoration: none;
            margin: 0px;
            padding: 0px 32px;
            border: 1px solid #382e59;
            border-bottom: 0px;
            border-top: 0px;
            margin-left: -1px;
            font-weight: 700;
        }

        /* Bloque .footer a:first-child ORIGINAL - REVISADO Y SINTÁCTICAMENTE CORRECTO */
        .footer a:first-child {
            border: 0px;
        }

        /* Bloque .footer a:last-child ORIGINAL - REVISADO Y SINTÁCTICAMENTE CORRECTO */
        .footer a:last-child {
            border: 0px;
        }

       

        /* Estilo para el saludo principal del Dr. */
        .greeting-line {
                  position: absolute;
                  top: 231px;
                  left: 26px;
                  color: #000000;
                  font-size: 21px;
                  font-weight: 600;
                  text-align: left;
        }

        /* Estilo para el número de teléfono del usuario */
        .user-phone-line {
            position: absolute;
            top: 4020px; /* Ajusta esta posición para que esté debajo del saludo */
            left: 62px;
            color: #000000;
            font-size: 21px; /* Puedes darle un tamaño diferente */
            font-weight: 600;
            text-align: left;
        }

        /* Estilo para el email del usuario */
        .user-email-line {
            position: absolute;
            top: 4045px; /* Ajusta esta posición para que esté debajo del teléfono */
            left: 62px;
            color: #000000;
            font-size: 21px; /* Puedes darle un tamaño diferente */
            font-weight: 600;
            text-align: left;
        }
    </style>
</head>

<body>
    <img src="images/email.jpg" alt="Jivi Superioridad Clinica">

    <p class="saludo">
        {{userName}}
    </p>
    <p class="nombre">
        <!-- Estimado Dr. {{accFname}} {{accLname}}<br> -->
    </p>
    <p class="greeting-line">
        Estimado(a) Dr. {{accTitle}} {{accFname}} {{accLname}}
    </p>

    <p class="user-phone-line">
        <a href="tel:{{User.Phone}}" style="color: #000000; text-decoration: none;">{{User.Phone}}</a>
    </p>

    <p class="user-email-line">
   <a href="mailto:{{userEmailAddress}}" style="color: #000000; text-decoration: none;">{{userEmailAddress}}</a>
    </p>

    <section class="footer">
        <a href="https://www.bayer.com/sites/default/files/Politica_Privacidad_Website_06112020.pdf" target="_blank" class="politica_privacidad" rel="noopener noreferrer">Política de privacidad</a>
        <a href="https://www.bayer.com/sites/default/files/General_Conditions_of%20Use_PACA.pdf" target="_blank" class="terminos_uso" rel="noopener noreferrer">Términos de uso</a>
        <a href="https://documents.eu.truman.bayer.com/co_ph/hcp/es/uns/unsubscribe_ae_commercial/?IdentityType=veeva&IdentityValue=001Qj00000R6N2PIAV&BrandID=RYqLl6L&ContentID=" target="_blank" class="cancelar_suscripción" rel="noopener noreferrer">Cancelar suscripción</a>
        <a href="https://www.bayer.com/en/contact-us?autotranslate=es" target="_blank" class="contacto" rel="noopener noreferrer">Contacto</a>
    </section>

</body>
</html>
